name: Send literature digest

on:
  # GitHub Actions uses UTC; 00:30 UTC is 08:30 in Beijing (UTC+8).
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      digest_days:
        description: Number of calendar days to include (1-14)
        required: false
        default: '3'
        type: string
      profile:
        description: Member profile to use; leave as default for the shared digest
        required: false
        default: default
        type: choice
        options:
          - default
          - su-haiyang
          - yang-yaru
          - he-rui
          - feng-yuanbao
      preview:
        description: Prefix the email subject with [试发]
        required: false
        default: false
        type: boolean
      send_members:
        description: Send all three personalized digests to members
        required: false
        default: false
        type: boolean
      send_li_hongyi:
        description: Send the shared digest to Li Hongyi
        required: false
        default: false
        type: boolean
      send_feng_yuanbao:
        description: Send Feng Yuanbao's personalized digest
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: literature-digest
  cancel-in-progress: false

jobs:
  send-scheduled-members:
    if: github.event_name == 'schedule' || inputs.send_members == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: su-haiyang
            recipient_secret: SU_HAIYANG_EMAIL
          - profile: yang-yaru
            recipient_secret: YANG_YARU_EMAIL
          - profile: he-rui
            recipient_secret: HE_RUI_EMAIL
          - profile: default
            recipient_secret: LI_HONGYI_EMAIL
          - profile: feng-yuanbao
            recipient_secret: FENG_YUANBAO_EMAIL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search papers and build member digest
        env:
          DIGEST_OUTPUT_PATH: daily-digest.html
          DIGEST_DAYS: '3'
          DIGEST_PROFILE: ${{ matrix.profile }}
        run: node scripts/send-daily-digest.mjs
      - name: Send member digest through NetEase SMTP
        env:
          SMTP_HOST: smtp.163.com
          SMTP_PORT: 465
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_TO_EMAIL: ${{ secrets[matrix.recipient_secret] }}
          NETEASE_SMTP_AUTH_CODE: ${{ secrets.NETEASE_SMTP_AUTH_CODE }}
          DIGEST_DAYS: '3'
          DIGEST_PROFILE: ${{ matrix.profile }}
          DIGEST_PREVIEW: 'false'
        run: python scripts/send-netease-smtp.py daily-digest.html

  send-manual-digest:
    if: github.event_name == 'workflow_dispatch' && inputs.send_members != true && inputs.send_li_hongyi != true && inputs.send_feng_yuanbao != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search papers and build digest
        env:
          DIGEST_OUTPUT_PATH: daily-digest.html
          DIGEST_DAYS: ${{ inputs.digest_days || '3' }}
          DIGEST_PROFILE: ${{ inputs.profile || '' }}
        run: node scripts/send-daily-digest.mjs
      - name: Send through NetEase SMTP
        env:
          SMTP_HOST: smtp.163.com
          SMTP_PORT: 465
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_TO_EMAIL: ${{ secrets.SMTP_TO_EMAIL }}
          NETEASE_SMTP_AUTH_CODE: ${{ secrets.NETEASE_SMTP_AUTH_CODE }}
          DIGEST_DAYS: ${{ inputs.digest_days || '3' }}
          DIGEST_PROFILE: ${{ inputs.profile || '' }}
          DIGEST_PREVIEW: ${{ inputs.preview || 'false' }}
        run: python scripts/send-netease-smtp.py daily-digest.html

  send-li-hongyi:
    if: github.event_name == 'workflow_dispatch' && inputs.send_li_hongyi == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search papers and build shared digest
        env:
          DIGEST_OUTPUT_PATH: daily-digest.html
          DIGEST_DAYS: '3'
          DIGEST_PROFILE: default
        run: node scripts/send-daily-digest.mjs
      - name: Send shared digest through NetEase SMTP
        env:
          SMTP_HOST: smtp.163.com
          SMTP_PORT: 465
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_TO_EMAIL: ${{ secrets.LI_HONGYI_EMAIL }}
          NETEASE_SMTP_AUTH_CODE: ${{ secrets.NETEASE_SMTP_AUTH_CODE }}
          DIGEST_DAYS: '3'
          DIGEST_PROFILE: default
          DIGEST_PREVIEW: 'false'
        run: python scripts/send-netease-smtp.py daily-digest.html

  send-feng-yuanbao:
    if: github.event_name == 'workflow_dispatch' && inputs.send_feng_yuanbao == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search papers and build Feng Yuanbao digest
        env:
          DIGEST_OUTPUT_PATH: daily-digest.html
          DIGEST_DAYS: '3'
          DIGEST_PROFILE: feng-yuanbao
        run: node scripts/send-daily-digest.mjs
      - name: Send Feng Yuanbao digest through NetEase SMTP
        env:
          SMTP_HOST: smtp.163.com
          SMTP_PORT: 465
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_TO_EMAIL: ${{ secrets.FENG_YUANBAO_EMAIL }}
          NETEASE_SMTP_AUTH_CODE: ${{ secrets.NETEASE_SMTP_AUTH_CODE }}
          DIGEST_DAYS: '3'
          DIGEST_PROFILE: feng-yuanbao
          DIGEST_PREVIEW: 'false'
        run: python scripts/send-netease-smtp.py daily-digest.html
